<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6F1">
<title>INSTANT BY PINTO — Visites techniques</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="mark">🏠🔥</div>
      <h1>Visites techniques</h1>
      <p>Instant by Pinto · étude avant installation</p>
    </div>
    <form id="loginForm" autocomplete="off">
      <label for="techSelect">Technicien</label>
      <select id="techSelect" style="display:none;"></select>
      <input type="text" id="nameInput" placeholder="Prénom Nom" autocomplete="name">
      <label for="pin">Code PIN</label>
      <input type="password" id="pin" placeholder="••••" required autocomplete="current-password" inputmode="numeric">
      <div class="error-msg" id="error"></div>
      <button type="submit" class="btn dark full" id="submitBtn" style="margin-top:16px;">Se connecter</button>
    </form>
    <a class="login-portail" href="https://app.instantbypinto.fr">Entrer par le portail Instant →</a>
  </div>
</div>
<script type="module" src="/js/login.js"></script>
</body>
</html>
